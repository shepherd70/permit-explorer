name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build site (assemble dist/index.html)
        run: python build.py

      # dist/ is committed as a deploy fallback (see README "Hosting"); a PR that
      # changes src/ or a passthrough file without rebuilding must not merge.
      - name: Fail if committed dist/ drifts from the build output
        run: |
          git diff --exit-code -- dist/
          test -z "$(git status --porcelain dist/)"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run test harness
        run: npm test
