name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build site (assemble dist/index.html)
        run: python build.py

      # dist/ is committed as a deploy fallback (see README "Hosting"); a PR that
      # changes src/ or a passthrough file without rebuilding must not merge.
      - name: Fail if committed dist/ drifts from the build output
        run: |
          git diff --exit-code -- dist/
          test -z "$(git status --porcelain dist/)"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run test harnesses (Calgary + Kitimat, offline) and the Kitimat fetcher unit tests
        run: npm test
